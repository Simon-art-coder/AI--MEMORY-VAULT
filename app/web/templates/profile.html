{% extends "base.html" %} {% from "_icons.html" import icon %} {% block title
%}Profile — AI Memory Vault{% endblock %} {% block content %}
<h2>Profile</h2>
<p class="page-subtitle">Your account details.</p>

<div class="card">
  <div class="card-header">
    <div class="card-icon neutral" style="font-size: 15px; font-weight: 700">
      {{ user.email[0]|upper }}
    </div>
    <div class="card-header-text">
      <h3>{{ user.email }}</h3>
      <p>Member since {{ user.created_at.strftime('%B %d, %Y') }}</p>
    </div>
  </div>
  <form method="get" action="/logout" style="margin-top: 4px">
    <button type="submit" class="secondary">
      {{ icon('log-out', 15) }} Log out
    </button>
  </form>
</div>
{% endblock %}
